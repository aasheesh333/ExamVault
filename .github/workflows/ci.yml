name: CI

on:
  push:
    # `master` is this repo's default branch; `main` is kept so a future rename
    # does not silently disable CI.
    branches: [master, main]
    # Release tags are cut by the `Publish to GitHub Release` step itself. They
    # are named `v1.0.1-build2` rather than `v1.0.1+2` because `+` is a special
    # character in this filter syntax ("one or more of the preceding"), which
    # makes the negation below impossible to express. Building a tag the publish
    # step just created would duplicate that run, so `-build<N>` tags are
    # excluded. A human-cut tag such as `v1.0.1` still builds.
    tags: ['v*', '!v*-build*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.4'

jobs:
  # ---------------------------------------------------------------------------
  # Fast gate: analyse + unit/widget tests. No secrets needed, so it runs on
  # every PR including forks.
  # ---------------------------------------------------------------------------
  verify:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      # `cache: true` is deliberately OFF. It caches the whole Flutter SDK, which
      # on this pin is ~1.64 GB — more than three times the entire 500 MB
      # artefact+cache allowance a private repo gets on the free plan. With it on,
      # one CI run filled the quota and every later upload failed with "Artifact
      # storage quota has been hit", which cost us the Play App Bundle. Losing the
      # cache costs roughly half a minute of download per job and is the only way
      # the build artefacts fit. Do not turn it back on without a paid plan.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Static analysis
        run: flutter analyze --fatal-infos

      - name: Tests
        # The live-network suite (test/live_edge_integration_test.dart) is gated
        # behind EV_LIVE=1, which CI deliberately does NOT set — the default run
        # must never depend on runner egress or on the live edge being up. To
        # exercise the real published objects, run locally:
        #   EV_LIVE=1 flutter test test/live_edge_integration_test.dart
        run: flutter test --reporter expanded

  # ---------------------------------------------------------------------------
  # Build. Credentials come ONLY from repository secrets and are passed as
  # --dart-define values, so nothing sensitive is ever written to the repo or to
  # the build log.
  # ---------------------------------------------------------------------------
  build-android:
    name: Build release APK
    # Never run on pull requests from forks — secrets are not available there.
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # `contents: write` is required by the release-publishing step below.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Cache stays off here for the same reason as in `verify`: the SDK cache
      # alone is bigger than the whole storage allowance, and this is the job
      # whose uploads actually need that allowance for the AAB and APKs.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Resolve dependencies
        run: flutter pub get

      # The signing keystore is materialised from secrets at build time and is
      # never committed. `key.properties` is git-ignored.
      #
      # NOTE: this step must NOT be gated with `if: ${{ secrets.X != '' }}`.
      # GitHub rejects `secrets` inside an `if:` expression and the whole
      # workflow fails to compile — zero jobs are created. The env var is
      # checked inside the shell instead.
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "No signing keystore configured — the APK will fall back to debug keys."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storePassword=$ANDROID_STORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - name: Build APK
        env:
          EV_CDN_BASE: ${{ secrets.EV_CDN_BASE }}
          EV_WEB_BASE: ${{ secrets.EV_WEB_BASE }}
          EV_FIREBASE_API_KEY: ${{ secrets.EV_FIREBASE_API_KEY }}
          EV_FIREBASE_APP_ID: ${{ secrets.EV_FIREBASE_APP_ID }}
          EV_FIREBASE_SENDER_ID: ${{ secrets.EV_FIREBASE_SENDER_ID }}
          EV_FIREBASE_PROJECT_ID: ${{ secrets.EV_FIREBASE_PROJECT_ID }}
          EV_FIREBASE_STORAGE_BUCKET: ${{ secrets.EV_FIREBASE_STORAGE_BUCKET }}
          EV_ONESIGNAL_APP_ID: ${{ secrets.EV_ONESIGNAL_APP_ID }}
        run: |
          set -euo pipefail
          # Two artefacts, because they answer different questions:
          #   .aab    — what Play Store requires for upload
          #   .apk    — what a student sideloads from a link
          # `--split-per-abi` keeps each APK near a third of the universal size.
          #
          # No fallback domain is supplied for EV_CDN_BASE: a build that cannot
          # reach its data is bad, but a build that silently points at a domain
          # nobody registered is worse — the app would show a permanent "no feed"
          # that looks like an outage rather than a misconfiguration.
          #
          # Guard, because the failure mode is silent: an *empty* secret still
          # passes `--dart-define=EV_CDN_BASE=""`, and an explicit empty define
          # OVERRIDES the worker URL compiled into AppConfig.cdnBase as its
          # default. Every request then becomes a schemeless path, the app ships
          # showing "no feed" forever, and CI reports green. Fail loudly here —
          # .github/SECRETS.md promises this behaviour.
          if [ -z "${EV_CDN_BASE:-}" ]; then
            echo "::error::EV_CDN_BASE secret is empty or missing — refusing to build. An empty --dart-define would override the compiled-in worker URL with '' and ship a silent 'no feed' app. See .github/SECRETS.md."
            exit 1
          fi
          # EV_APP_VERSION feeds the About sheet; derived from pubspec so the
          # displayed version can never drift from the shipped one. The path is
          # relative to this job's `working-directory: app` — `app/pubspec.yaml`
          # resolves to `app/app/pubspec.yaml` and finds nothing.
          #
          # Guard, because the failure mode is silent twice over: the value is
          # passed as an *argument*, and a command substitution that fails
          # inside an argument does not trip `set -e`, so the build proceeds
          # with EV_APP_VERSION="" and CI reports green. The About sheet then
          # omits the version clause entirely and the installed build cannot be
          # traced to a release. The `|| true` is deliberate: it lets the guard
          # below explain itself instead of `set -e` killing the step with a
          # bare grep error.
          EV_APP_VERSION="$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')" || true
          if [ -z "${EV_APP_VERSION}" ]; then
            echo "::error::Could not derive the app version from app/pubspec.yaml — refusing to build. EV_APP_VERSION would be '' and the About sheet would ship with no version, leaving the release untraceable. Check that pubspec.yaml still has a top-level 'version:' line."
            exit 1
          fi
          flutter build apk --release --split-per-abi \
            --dart-define=EV_CDN_BASE="${EV_CDN_BASE}" \
            --dart-define=EV_WEB_BASE="${EV_WEB_BASE:-}" \
            --dart-define=EV_FIREBASE_API_KEY="$EV_FIREBASE_API_KEY" \
            --dart-define=EV_FIREBASE_APP_ID="$EV_FIREBASE_APP_ID" \
            --dart-define=EV_FIREBASE_SENDER_ID="$EV_FIREBASE_SENDER_ID" \
            --dart-define=EV_FIREBASE_PROJECT_ID="$EV_FIREBASE_PROJECT_ID" \
            --dart-define=EV_FIREBASE_STORAGE_BUCKET="$EV_FIREBASE_STORAGE_BUCKET" \
            --dart-define=EV_ONESIGNAL_APP_ID="$EV_ONESIGNAL_APP_ID" \
            --dart-define=EV_APP_VERSION="${EV_APP_VERSION}"

          # A universal APK, alongside the three split ones above. The splits are
          # smaller per device, but they require the downloader to know their
          # phone's ABI — a student who taps the wrong one gets "app not
          # compatible", and most people cannot tell arm64 from armeabi. This
          # single ~50 MB file installs on every device, which is what a WhatsApp
          # or direct-link sideload needs. It lands as `app-release.apk` next to
          # `app-<abi>-release.apk`, so the `*.apk` globs below pick up all four.
          #
          # The App Bundle is already universal (all three ABIs), so this is only
          # for distribution outside Play.
          flutter build apk --release \
            --dart-define=EV_CDN_BASE="${EV_CDN_BASE}" \
            --dart-define=EV_WEB_BASE="${EV_WEB_BASE:-}" \
            --dart-define=EV_FIREBASE_API_KEY="$EV_FIREBASE_API_KEY" \
            --dart-define=EV_FIREBASE_APP_ID="$EV_FIREBASE_APP_ID" \
            --dart-define=EV_FIREBASE_SENDER_ID="$EV_FIREBASE_SENDER_ID" \
            --dart-define=EV_FIREBASE_PROJECT_ID="$EV_FIREBASE_PROJECT_ID" \
            --dart-define=EV_FIREBASE_STORAGE_BUCKET="$EV_FIREBASE_STORAGE_BUCKET" \
            --dart-define=EV_ONESIGNAL_APP_ID="$EV_ONESIGNAL_APP_ID" \
            --dart-define=EV_APP_VERSION="${EV_APP_VERSION}"

          # Play Console only accepts an App Bundle. Building only an APK meant
          # the pipeline could never produce something uploadable, which is the
          # difference between "a release build exists" and "a release exists".
          # EV_APP_VERSION as above (About sheet).
          flutter build appbundle --release \
            --dart-define=EV_CDN_BASE="${EV_CDN_BASE}" \
            --dart-define=EV_WEB_BASE="${EV_WEB_BASE:-}" \
            --dart-define=EV_FIREBASE_API_KEY="$EV_FIREBASE_API_KEY" \
            --dart-define=EV_FIREBASE_APP_ID="$EV_FIREBASE_APP_ID" \
            --dart-define=EV_FIREBASE_SENDER_ID="$EV_FIREBASE_SENDER_ID" \
            --dart-define=EV_FIREBASE_PROJECT_ID="$EV_FIREBASE_PROJECT_ID" \
            --dart-define=EV_FIREBASE_STORAGE_BUCKET="$EV_FIREBASE_STORAGE_BUCKET" \
            --dart-define=EV_ONESIGNAL_APP_ID="$EV_ONESIGNAL_APP_ID" \
            --dart-define=EV_APP_VERSION="${EV_APP_VERSION}"

      # Publishing is deliberately the first thing that touches storage. The
      # bundle is the only artefact a release is judged by, and a GitHub Release
      # does not draw on the 500 MB Actions store that the Flutter SDK cache
      # exhausted (see the `cache` note above). It also never expires, so a
      # bundle built today is still downloadable when the Play submission is
      # actually made — which a 3-day workflow artefact cannot promise.
      #
      # Gated on `workflow_dispatch` so publishing is a deliberate act, not a
      # side effect of every push to master. Idempotent: re-dispatching the same
      # version updates the existing release instead of failing.
      - name: Publish to GitHub Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')"
          if [ -z "${VERSION}" ]; then
            echo "::error::Could not derive the app version from app/pubspec.yaml — refusing to publish an unversioned release."
            exit 1
          fi
          # `1.0.1+2` -> `v1.0.1-build2`. The `+` form is what pubspec and Play
          # use, but `+` is special in workflow filter globs, so the tag spells
          # the build number out instead.
          NAME="${VERSION%%+*}"
          BUILD="${VERSION#*+}"
          if [ "${BUILD}" = "${VERSION}" ]; then
            TAG="v${VERSION}"
          else
            TAG="v${NAME}-build${BUILD}"
          fi
          echo "Publishing ${VERSION} as release ${TAG}"
          NOTES="$(printf '%s\n\n%s\n\n%s\n%s\n%s\n%s\n' \
            "Signed build of ExamVault \`${VERSION}\` (commit ${GITHUB_SHA})." \
            "**Play Store:** upload \`app-release.aab\` — it is universal (arm64-v8a, armeabi-v7a, x86_64) and Play splits it per device." \
            "**Sideload:**" \
            "- \`app-release.apk\` — universal, installs on any phone (use this if unsure)" \
            "- \`app-arm64-v8a-release.apk\` — most phones since ~2017, smallest download" \
            "- \`app-armeabi-v7a-release.apk\` — older 32-bit devices only" \
            "- \`app-x86_64-release.apk\` — emulators only")"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --notes "${NOTES}"
          else
            gh release create "${TAG}" \
              --target "${GITHUB_SHA}" \
              --title "ExamVault ${VERSION}" \
              --notes "${NOTES}"
          fi
          # --clobber so a re-dispatch of the same version replaces the assets
          # rather than erroring on the existing filename.
          gh release upload "${TAG}" --clobber \
            build/app/outputs/bundle/release/app-release.aab \
            build/app/outputs/flutter-apk/*.apk

      # The App Bundle goes first, and both uploads run even if the other one
      # fails. The AAB is the Play artefact; on 2026-11-17 an exhausted
      # artefact-storage quota failed the APK upload, and because steps stop at
      # the first failure the AAB was never uploaded — a green build that
      # produced a signed 56.6 MB bundle nobody could download. Ordering plus
      # `if: always()` means one artefact's storage problem can never cost you
      # the other one.
      # Best-effort only. GitHub's 500 MB free allowance is *account-wide*, not
      # per repository: on 2026-11-17 this repo had 0 bytes stored and the upload
      # still failed, because a sibling repo held 2.3 GB. Nothing this workflow
      # does can free that, so a green build must not depend on it. The Release
      # step above is the authoritative, permanent copy of these files; these
      # artifacts are the convenience copy and resume working the moment the
      # account is under its limit. `continue-on-error` is therefore correct
      # here, not a way of hiding a real failure.
      - name: Upload App Bundle
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: examvault-aab
          path: app/build/app/outputs/bundle/release/*.aab
          retention-days: 3
          if-no-files-found: error

      - name: Upload APKs
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: examvault-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          retention-days: 3
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Path filter for deploy-edge. `on.push.paths` would gate the whole workflow
  # (verify/build must run on every push), so the "only when infra/ changed"
  # contract is implemented per-job: this detector turns the push's diff into a
  # boolean that deploy-edge's `if` consumes.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect infra changes
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - 'infra/**'

  # ---------------------------------------------------------------------------
  # Edge deploy. Only on master/main pushes, only when infra/ changed (the
  # `changes` job above computes the infra/** filter).
  # ---------------------------------------------------------------------------
  deploy-edge:
    name: Deploy Cloudflare worker
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && needs.changes.outputs.infra == 'true'
    needs: [verify, changes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
