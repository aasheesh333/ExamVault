name: CI

on:
  push:
    # `master` is this repo's default branch; `main` is kept so a future rename
    # does not silently disable CI.
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.4'

jobs:
  # ---------------------------------------------------------------------------
  # Fast gate: analyse + unit/widget tests. No secrets needed, so it runs on
  # every PR including forks.
  # ---------------------------------------------------------------------------
  verify:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze --fatal-infos

      - name: Tests
        run: flutter test --reporter expanded

  # ---------------------------------------------------------------------------
  # Build. Credentials come ONLY from repository secrets and are passed as
  # --dart-define values, so nothing sensitive is ever written to the repo or to
  # the build log.
  # ---------------------------------------------------------------------------
  build-android:
    name: Build release APK
    # Never run on pull requests from forks — secrets are not available there.
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # The signing keystore is materialised from secrets at build time and is
      # never committed. `key.properties` is git-ignored.
      #
      # NOTE: this step must NOT be gated with `if: ${{ secrets.X != '' }}`.
      # GitHub rejects `secrets` inside an `if:` expression and the whole
      # workflow fails to compile — zero jobs are created. The env var is
      # checked inside the shell instead.
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "No signing keystore configured — the APK will fall back to debug keys."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storePassword=$ANDROID_STORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - name: Build APK
        env:
          EV_CDN_BASE: ${{ secrets.EV_CDN_BASE }}
          EV_WEB_BASE: ${{ secrets.EV_WEB_BASE }}
          EV_FIREBASE_API_KEY: ${{ secrets.EV_FIREBASE_API_KEY }}
          EV_FIREBASE_APP_ID: ${{ secrets.EV_FIREBASE_APP_ID }}
          EV_FIREBASE_SENDER_ID: ${{ secrets.EV_FIREBASE_SENDER_ID }}
          EV_FIREBASE_PROJECT_ID: ${{ secrets.EV_FIREBASE_PROJECT_ID }}
          EV_FIREBASE_STORAGE_BUCKET: ${{ secrets.EV_FIREBASE_STORAGE_BUCKET }}
          EV_ONESIGNAL_APP_ID: ${{ secrets.EV_ONESIGNAL_APP_ID }}
        run: |
          set -euo pipefail
          flutter build apk --release \
            --dart-define=EV_CDN_BASE="${EV_CDN_BASE:-https://cdn.examvault.in}" \
            --dart-define=EV_WEB_BASE="${EV_WEB_BASE:-https://examvault.in}" \
            --dart-define=EV_FIREBASE_API_KEY="$EV_FIREBASE_API_KEY" \
            --dart-define=EV_FIREBASE_APP_ID="$EV_FIREBASE_APP_ID" \
            --dart-define=EV_FIREBASE_SENDER_ID="$EV_FIREBASE_SENDER_ID" \
            --dart-define=EV_FIREBASE_PROJECT_ID="$EV_FIREBASE_PROJECT_ID" \
            --dart-define=EV_FIREBASE_STORAGE_BUCKET="$EV_FIREBASE_STORAGE_BUCKET" \
            --dart-define=EV_ONESIGNAL_APP_ID="$EV_ONESIGNAL_APP_ID"

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: examvault-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          retention-days: 14
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Edge deploy. Only on main, only when infra/ changed.
  # ---------------------------------------------------------------------------
  deploy-edge:
    name: Deploy Cloudflare worker
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
