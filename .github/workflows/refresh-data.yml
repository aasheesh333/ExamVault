name: Refresh exam data

# Pulls the official feeds (SSC, UPSC, IBPS, TNPSC, RRB) and republishes
# them to the edge.
#
# Why a separate workflow: the app's CI must stay fast and secret-free for PRs.
# This job needs the Cloudflare token, so it runs on a schedule and on demand,
# never on a pull request.
#
# CAVEAT (read before relying on this in production): GitHub disables scheduled
# workflows after 60 days of repository inactivity. For a Play-Store-grade
# service, run the same two commands from a real cron (a £3 VPS, Cloudflare Cron
# Trigger, or a scheduled Worker) and keep this as the manual/fallback path.

on:
  schedule:
    # Hourly, at an off-peak minute. This used to be */30 and GitHub silently
    # SKIPPED most runs (observed: 8-hour gaps on 2026-11-10/11) — free-tier
    # minutes cannot fund 48 runs/day, and over-quota scheduled runs simply do
    # not start. With the failure-cooldown memo (build_indexes.py) a steady-
    # state run is ~2 min (fetch + validate + no-commit), so hourly fits the
    # budget with headroom for CI. On result day, trigger an immediate run:
    #   gh workflow run "Refresh exam data" -f publish=true
    # and the app itself shows feed age ("EDGE · 3h OLD"), so staleness is
    # never silent.
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to the edge (otherwise validate only)'
        type: boolean
        default: true
      verify_push:
        description: 'Send one self-test push (topic examvault_selftest — notifies nobody)'
        type: boolean
        default: false

concurrency:
  group: refresh-exam-data
  cancel-in-progress: false

jobs:
  refresh:
    name: Fetch official feed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The job commits the refreshed snapshot and pushes it back to master. The
    # default GITHUB_TOKEN is read-only, so every scheduled run fetched and
    # validated fine and then died at `git push` with "403: Write access to
    # repository not granted" — three nights of silent refresh failures.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF reader
        run: pip install --quiet pypdf

      - name: Fetch official notices
        working-directory: tools
        run: node fetch_official_feeds.mjs --out ../data/live_feed.json

      # Validate before touching the edge: publish_feed.mjs rejects a document
      # with a missing field, an unknown category/status, or a future timestamp.
      - name: Validate feed
        working-directory: tools
        run: node publish_feed.mjs --in ../data/live_feed.json --dry-run

      # Turn each published result PDF into a searchable roll index. This is what
      # makes "check my roll number in 1 ms" real instead of aspirational.
      # A PDF that yields too few rolls is skipped rather than published — see
      # build_indexes.py for why that matters.
      - name: Build roll indexes
        if: ${{ github.event_name == 'schedule' || inputs.publish }}
        working-directory: tools
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 build_indexes.py --feed ../data/live_feed.json --limit 8

      # Snapshot BEFORE publishing, so the dispatcher can diff "what the edge
      # had" against "what it has now". Captured before the commit step because
      # that step moves HEAD.
      - name: Keep the previous snapshot
        run: |
          set -euo pipefail
          git show HEAD:data/live_feed.json > "$RUNNER_TEMP/prev_feed.json" 2>/dev/null \
            || echo '{}' > "$RUNNER_TEMP/prev_feed.json"

      - name: Publish feed
        if: ${{ github.event_name == 'schedule' || inputs.publish }}
        working-directory: tools
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node publish_feed.mjs --in ../data/live_feed.json

      # Push the diff to the students who switched a bell on, through whichever
      # provider has credentials. The script exits 0 when none are configured
      # (with a loud log) because a missing notification must never redden the
      # pipeline that publishes the data itself.
      - name: Verify the push send path
        if: ${{ inputs.verify_push }}
        env:
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
        run: node tools/dispatch_alerts.mjs --verify-send

      - name: Notify students
        if: ${{ github.event_name == 'schedule' || inputs.publish }}
        env:
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          EV_ONESIGNAL_APP_ID: ${{ secrets.EV_ONESIGNAL_APP_ID }}
          EV_ONESIGNAL_REST_KEY: ${{ secrets.EV_ONESIGNAL_REST_KEY }}
        run: |
          node tools/dispatch_alerts.mjs \
            --old "$RUNNER_TEMP/prev_feed.json" \
            --new data/live_feed.json

      # Keep a copy so the feed's history is reviewable in the repo — but ONLY
      # when the CONTENT changed.
      #
      # fetched_at / sources[].checked_at / sources[].elapsed_ms differ on
      # every run by construction, so a raw `git diff` was dirty on all ~48
      # daily runs and the history was pure noise. The comparison uses the
      # same normalization as fetch_official_feeds.mjs's revision logic
      # (tools/normalize_feed.mjs): volatile fields stripped, keys sorted.
      # No content change → no commit, no push.
      - name: Commit the snapshot
        run: |
          set -euo pipefail
          git show HEAD:data/live_feed.json > "$RUNNER_TEMP/head_feed.json" 2>/dev/null \
            || echo '{}' > "$RUNNER_TEMP/head_feed.json"
          node tools/normalize_feed.mjs "$RUNNER_TEMP/head_feed.json" > "$RUNNER_TEMP/head_norm.json"
          node tools/normalize_feed.mjs data/live_feed.json           > "$RUNNER_TEMP/new_norm.json"
          if diff -q "$RUNNER_TEMP/head_norm.json" "$RUNNER_TEMP/new_norm.json" > /dev/null; then
            echo "feed content unchanged (volatile timestamps only) — skipping commit"
            exit 0
          fi
          git config user.name  "examvault-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/live_feed.json
          git commit -m "data: refresh official exam feed [skip ci]"
          # A scheduled run can race another push to master (or a slow job can
          # overlap the next scheduled one); rebasing beats failing the push.
          git pull --rebase
          git push
