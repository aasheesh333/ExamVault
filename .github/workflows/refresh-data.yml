name: Refresh exam data

# Pulls the official feeds (SSC, UPSC, IBPS, TNPSC, RRB) and republishes
# them to the edge.
#
# Why a separate workflow: the app's CI must stay fast and secret-free for PRs.
# This job needs the Cloudflare token, so it runs on a schedule and on demand,
# never on a pull request.
#
# CAVEAT (read before relying on this in production): GitHub disables scheduled
# workflows after 60 days of repository inactivity. For a Play-Store-grade
# service, run the same two commands from a real cron (a £3 VPS, Cloudflare Cron
# Trigger, or a scheduled Worker) and keep this as the manual/fallback path.

on:
  schedule:
    # Every 30 minutes. SSC typically publishes between 09:00 and 20:00 IST.
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to the edge (otherwise validate only)'
        type: boolean
        default: true

concurrency:
  group: refresh-exam-data
  cancel-in-progress: false

jobs:
  refresh:
    name: Fetch official feed
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF reader
        run: pip install --quiet pypdf

      - name: Fetch official notices
        working-directory: tools
        run: node fetch_official_feeds.mjs --out ../data/live_feed.json

      # Validate before touching the edge: publish_feed.mjs rejects a document
      # with a missing field, an unknown category/status, or a future timestamp.
      - name: Validate feed
        working-directory: tools
        run: node publish_feed.mjs --in ../data/live_feed.json --dry-run

      # Turn each published result PDF into a searchable roll index. This is what
      # makes "check my roll number in 1 ms" real instead of aspirational.
      # A PDF that yields too few rolls is skipped rather than published — see
      # build_indexes.py for why that matters.
      - name: Build roll indexes
        if: ${{ github.event_name == 'schedule' || inputs.publish }}
        working-directory: tools
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 build_indexes.py --feed ../data/live_feed.json --limit 8

      - name: Publish feed
        if: ${{ github.event_name == 'schedule' || inputs.publish }}
        working-directory: tools
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node publish_feed.mjs --in ../data/live_feed.json

      # Keep a copy so the feed's history is reviewable in the repo.
      - name: Commit the snapshot
        run: |
          set -euo pipefail
          if git diff --quiet -- data/live_feed.json; then
            echo "no change"
            exit 0
          fi
          git config user.name  "examvault-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/live_feed.json
          git commit -m "data: refresh official exam feed [skip ci]"
          git push
