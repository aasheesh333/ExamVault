name = "examvault-edge"
main = "src/index.js"
compatibility_date = "2026-01-01"
workers_dev = true

# Everything the app fetches lives in one private bucket. Objects are public only
# through this worker, so the bucket itself can stay non-public and the cache
# policy is enforced in exactly one place.
[[r2_buckets]]
binding = "EXAMVAULT_BUCKET"
bucket_name = "examvault-cdn"

[observability]
enabled = true
head_sampling_rate = 0.05

# No [limits] block on purpose: explicit CPU limits require a paid plan. The free
# tier already caps the worker at 10 ms, and this handler is a cache lookup plus a
# stream pass-through — it uses a fraction of that.
